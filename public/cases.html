<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cases List - Delivery Portal</title>
  <link rel="stylesheet" href="/css/portal.css">
  <script src="/js/shared.js"></script>
</head>
<body>

<div id="globalOverlayLoader">
  <div class="big-spinner"></div>
  <p style="margin-top: 12px; font-weight: bold; color: #1a73e8;" id="overlayText">Loading portal data...</p>
</div>

<div class="header">
  <h3 style="margin:0;">Delivery Portal</h3>
  <div>
    <span id="userInfo" style="margin-right: 15px;"></span>
    <a id="dashNavBtn" href="/dashboard" class="nav-btn">Dashboard</a>
    <a id="casesNavBtn" href="/cases" class="nav-btn">Cases List</a>
    <a id="adminNavBtn" href="/users" class="nav-btn hidden">Manage Users</a>
    <a id="superadminNavBtn" href="/companies" class="nav-btn hidden">Manage Companies</a>
    <button class="nav-btn btn-danger" onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h3 style="margin:0;">Cases List</h3>
    <button onclick="toggleRegisterForm()">+ Register New Case</button>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <label for="statusFilter">Case Status</label>
      <select id="statusFilter" onchange="applyFilters()" style="font-weight: bold; min-width: 120px;">
        <option value="OPEN" selected>OPEN</option>
        <option value="CLOSED">CLOSED</option>
        <option value="ALL">ALL</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="assignedUserFilter">Assigned User</label>
      <select id="assignedUserFilter" onchange="applyFilters()" style="font-weight: bold; min-width: 160px;"></select>
    </div>

    <div class="filter-group" style="flex: 1;">
      <label for="searchInput">Search CN / Ref</label>
      <input type="text" id="searchInput" placeholder="Filter by CN Number or Ref Number..." onkeyup="handleSearch(event)">
    </div>

    <button id="searchBtn" onclick="applySearch()">Search</button>
    <button class="btn-danger" onclick="clearSearch()">Clear</button>
  </div>

  <div id="registerForm" class="hidden" style="background:#f9f9f9; padding:15px; margin-top:10px; border-radius:5px;">
    <h4>New Case Details</h4>
    <input type="text" id="regCn" placeholder="CN Number" style="width:23%">
    <input type="text" id="regRef" placeholder="Ref Number" style="width:23%">
    <input type="text" id="regMobile" placeholder="Mobile Number" style="width:23%">
    <select id="regAssignee" style="width:23%"></select><br>
    <button id="submitCaseBtn" onclick="registerCase()">Submit Registration</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Company</th>
        <th>CN Number</th>
        <th>Ref Number</th>
        <th>Mobile</th>
        <th>Assigned To</th>
        <th>Status</th>
        <th>Delivery Outcome</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="casesTableBody"></tbody>
  </table>

  <div class="pagination">
    <button id="prevBtn" onclick="changePage(-1)">← Previous</button>
    <span id="pageInfo">Page 1 of 1</span>
    <button id="nextBtn" onclick="changePage(1)">Next →</button>
  </div>
</div>

<script>
var registeredUsers = [];
var currentPage = 1;
var totalPages = 1;
var currentSearch = '';
var currentStatus = 'OPEN';
var currentAssignedUser = '';

async function fetchUsersList() {
  try {
    var res = await fetch('/api/users');
    if (res.ok) {
      registeredUsers = await res.json();
      populateUserDropdowns();
    }
  } catch(e) {}
}

function populateUserDropdowns() {
  var regSelect = document.getElementById('regAssignee');
  var filterSelect = document.getElementById('assignedUserFilter');

  var options = '<option value="Unassigned">Assign To (Default: Unassigned)</option>';
  options += registeredUsers.map(function(u) { return '<option value="' + u.username + '">' + u.username + '</option>'; }).join('');
  if (regSelect) regSelect.innerHTML = options;

  var filterOptions = '<option value="ALL">ALL Users</option>';
  filterOptions += registeredUsers.map(function(u) { return '<option value="' + u.username + '">' + u.username + '</option>'; }).join('');
  
  if (filterSelect) {
    filterSelect.innerHTML = filterOptions;

    // Ensure initial selection defaults strictly to logged-in user
    if (currentUser && currentUser.username) {
      filterSelect.value = currentUser.username;
      currentAssignedUser = currentUser.username;
    } else {
      filterSelect.value = 'ALL';
      currentAssignedUser = 'ALL';
    }
  }
}

function toggleRegisterForm() {
  document.getElementById('registerForm').classList.toggle('hidden');
}

async function registerCase() {
  var btn = document.getElementById('submitCaseBtn');
  var cn_number = document.getElementById('regCn').value;
  var ref_number = document.getElementById('regRef').value;
  var mobile_number = document.getElementById('regMobile').value;
  var assigned_to = document.getElementById('regAssignee').value;

  if (!cn_number) return alert('CN Number is required');
  btn.disabled = true;

  try {
    var res = await fetch('/api/cases', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cn_number: cn_number, ref_number: ref_number, mobile_number: mobile_number, assigned_to: assigned_to })
    });

    if (res.ok) {
      document.getElementById('regCn').value = '';
      document.getElementById('regRef').value = '';
      document.getElementById('regMobile').value = '';
      toggleRegisterForm();
      await loadCases();
    } else {
      var err = await res.json();
      alert(err.error);
    }
  } catch (err) { alert('Failed to register case'); } 
  finally { btn.disabled = false; }
}

async function loadCases() {
  showOverlay('Loading cases list...');
  try {
    var url = '/api/cases?page=' + currentPage + '&limit=100&search=' + encodeURIComponent(currentSearch) + '&status=' + encodeURIComponent(currentStatus) + '&assigned_to=' + encodeURIComponent(currentAssignedUser);
    var res = await fetch(url);
    var data = await res.json();
    
    var tbody = document.getElementById('casesTableBody');
    tbody.innerHTML = (data.cases || []).map(function(c) {
      var deliveryBadge = '-';
      if (c.status === 'CLOSED') {
        if (c.is_delivered === true) deliveryBadge = '<span class="badge-delivered">DELIVERED</span>';
        else if (c.is_delivered === false) deliveryBadge = '<span class="badge-undelivered">UNDELIVERED</span>';
      }

      var caseId = c.id || c._id;
      return '<tr>' +
        '<td><span class="company-badge">' + c.company_name + '</span></td>' +
        '<td><b>' + c.cn_number + '</b></td>' +
        '<td>' + (c.ref_number || '-') + '</td>' +
        '<td>' + (c.mobile_number || '-') + '</td>' +
        '<td><span class="user-badge">' + (c.assigned_to || 'Unassigned') + '</span></td>' +
        '<td class="' + (c.status === 'OPEN' ? 'status-open' : 'status-closed') + '">' + c.status + '</td>' +
        '<td>' + deliveryBadge + '</td>' +
        '<td><a href="/timeline?id=' + caseId + '" style="text-decoration:none; padding:6px 12px; background:#1a73e8; color:white; border-radius:4px; font-size:0.85rem;">View Timeline</a></td>' +
      '</tr>';
    }).join('');

    currentPage = data.page || 1;
    totalPages = data.totalPages || 1;
    document.getElementById('pageInfo').innerText = 'Page ' + currentPage + ' of ' + totalPages + ' (' + (data.total || 0) + ' records)';
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  } catch (err) { alert('Failed to fetch cases list.'); } 
  finally { hideOverlay(); }
}

function applyFilters() {
  currentStatus = document.getElementById('statusFilter').value;
  currentAssignedUser = document.getElementById('assignedUserFilter').value;
  currentPage = 1;
  loadCases();
}

function handleSearch(event) { if (event.key === 'Enter') applySearch(); }
function applySearch() { currentSearch = document.getElementById('searchInput').value; currentPage = 1; loadCases(); }

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'OPEN';
  
  if (currentUser && currentUser.username) {
    document.getElementById('assignedUserFilter').value = currentUser.username;
    currentAssignedUser = currentUser.username;
  } else {
    document.getElementById('assignedUserFilter').value = 'ALL';
    currentAssignedUser = 'ALL';
  }

  currentSearch = '';
  currentStatus = 'OPEN';
  currentPage = 1;
  loadCases();
}

function changePage(dir) { currentPage += dir; loadCases(); }

checkAuth('casesNavBtn').then(function() {
  // Set default filters before initial fetch
  if (currentUser && currentUser.username) {
    currentAssignedUser = currentUser.username;
  }
  currentStatus = 'OPEN';
  document.getElementById('statusFilter').value = 'OPEN';

  fetchUsersList().then(function() {
    loadCases();
  });
});
</script>
</body>
</html>
