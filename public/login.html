<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delivery Portal - Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #333; }
    .container { max-width: 400px; margin: 80px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; font-weight: bold; }
    button:hover { background: #1557b0; }
    button:disabled { background: #ccc !important; cursor: not-allowed !important; }
    .hidden { display: none !important; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #globalOverlayLoader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.7);
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
    }
    .big-spinner { width: 40px; height: 40px; border: 4px solid #1a73e8; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  </style>
</head>
<body>

<div id="globalOverlayLoader">
  <div class="big-spinner"></div>
  <p style="margin-top: 12px; font-weight: bold; color: #1a73e8;">Checking session...</p>
</div>

<div class="container">
  <h2 style="margin-top:0;">Multi-Company Portal</h2>
  <div id="loginError" style="color:red; margin-bottom: 10px;"></div>
  <input type="text" id="loginUser" placeholder="Username">
  <input type="password" id="loginPass" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<script>
function hideOverlay() {
  document.getElementById('globalOverlayLoader').classList.add('hidden');
}

async function checkAuth() {
  try {
    const res = await fetch('/api/me');
    if (res.ok) {
      window.location.href = '/cases.html';
    } else {
      hideOverlay();
    }
  } catch (err) {
    hideOverlay();
  }
}

async function login() {
  const btn = document.getElementById('loginBtn');
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();

  if (!username || !password) return alert('Provide both username and password');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Logging in...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      window.location.href = '/cases.html';
    } else {
      const err = await res.json();
      document.getElementById('loginError').innerText = err.error || 'Login failed';
    }
  } catch (err) {
    alert('Network error while logging in.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Login';
  }
}

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('loginPass').addEventListener('keyup', function(e) {
  if (e.key === 'Enter') login();
});

checkAuth();
</script>
</body>
</html>
